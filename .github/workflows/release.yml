name: Release
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Gõ tag muốn release (ví dụ: munin-cursor-v0.1.0, hoặc "all" để release toàn bộ)'
        required: true
        default: 'all'
  push:
    tags:
      - "spec-v*"
      - "munin-sdk-v*"
      - "sdk-py-v*"
      - "munin-cursor-v*"
      - "munin-claude-v*"
      - "munin-gemini-v*"
      - "munin-openclaw-v*"
      - "munin-mcp-server-v*"
      - "munin-antigravity-v*"
      - "munin-kilo-v*"
      - "munin-qwen-v*"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint && pnpm build && pnpm test
          pnpm test:contract:mock &
          MOCK_PID=$!
          echo "Waiting for mock server on port 4010..."
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4010/api/mcp/capabilities > /dev/null 2>&1; then
              echo "Mock server ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Mock server failed to start within 30s"
              kill "$MOCK_PID" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          pnpm test:contract
          kill "$MOCK_PID" 2>/dev/null || true

  release-routing:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Resolve package from tag
        id: resolve
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Release tag: ${TAG}"
          if [ "${TAG}" = "all" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "mode=single" >> "$GITHUB_OUTPUT"
            case "${TAG}" in
              spec-v*) echo "target=packages/spec" >> "$GITHUB_OUTPUT" ;;
              munin-sdk-v*) echo "target=packages/ts-sdk" >> "$GITHUB_OUTPUT" ;;
              sdk-py-v*) echo "target=packages/python-sdk" >> "$GITHUB_OUTPUT" ;;
              munin-cursor-v*) echo "target=adapters/cursor" >> "$GITHUB_OUTPUT" ;;
              munin-claude-v*) echo "target=adapters/claude" >> "$GITHUB_OUTPUT" ;;
              munin-gemini-v*) echo "target=adapters/gemini" >> "$GITHUB_OUTPUT" ;;
              munin-openclaw-v*) echo "target=adapters/openclaw" >> "$GITHUB_OUTPUT" ;;
              munin-mcp-server-v*) echo "target=adapters/mcp-server" >> "$GITHUB_OUTPUT" ;;
              munin-antigravity-v*) echo "target=adapters/antigravity" >> "$GITHUB_OUTPUT" ;;
              munin-kilo-v*) echo "target=adapters/kilo" >> "$GITHUB_OUTPUT" ;;
              munin-qwen-v*) echo "target=adapters/qwen" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unsupported tag format"; exit 1 ;;
            esac
          fi

  publish:
    runs-on: ubuntu-latest
    needs: release-routing
    # Trusted publishing (OIDC): npm accepts this job because the trusted
    # publisher of every package names kalera-labs/munin-for-agents,
    # release.yml and the environment below. No npm token is used.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      # Node 24 ships npm 11 (trusted publishing needs >= 11.5.1).
      # No dependency cache in the release job.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish
        env:
          MODE: ${{ needs.release-routing.outputs.mode }}
          TARGET: ${{ needs.release-routing.outputs.target }}
        run: |
          set -euo pipefail
          if [ "$MODE" != "all" ]; then
            bash .github/scripts/npm-publish-oidc.sh "$TARGET" --pnpm-pack
            exit 0
          fi
          # Publish each non-private package on its own, so one failure does
          # not leave every later package unpublished. Versions already on npm
          # are skipped by the script, so a re-run is safe.
          FAILED=""
          for dir in packages/* adapters/*; do
            [ -f "$dir/package.json" ] || continue
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "Skipping private package: $dir"
              continue
            fi
            bash .github/scripts/npm-publish-oidc.sh "$dir" --pnpm-pack || FAILED="$FAILED $dir"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Failed to publish:$FAILED"
            exit 1
          fi
